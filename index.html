<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SecondSelf | The Cartographer</title>
    <!-- Modern Typography: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <!-- Vis.js Network Library -->
    <script type="text/javascript" src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
    
    <style>
        :root {
            --bg-color: #0f172a;
            --panel-bg: rgba(30, 41, 59, 0.7);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: rgba(255, 255, 255, 0.1);
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        /* Glassmorphism Header */
        header {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 10;
            background: var(--panel-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 20px 30px;
            border-radius: 16px;
            border: 1px solid var(--border-color);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5);
        }

        header h1 {
            margin: 0;
            font-size: 1.8rem;
            font-weight: 800;
            background: linear-gradient(90deg, #38bdf8, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.5px;
        }

        header p {
            margin: 5px 0 0 0;
            font-size: 0.9rem;
            color: var(--text-muted);
            font-weight: 600;
        }

        /* Graph Container */
        #mynetwork {
            width: 100vw;
            height: 100vh;
            background: radial-gradient(circle at center, #1e293b 0%, #0f172a 100%);
        }

        /* Vis.js Custom Tooltip Styling (Glassmorphism) */
        .vis-tooltip {
            position: absolute;
            background-color: rgba(15, 23, 42, 0.85) !important;
            backdrop-filter: blur(8px) !important;
            border: 1px solid rgba(255, 255, 255, 0.15) !important;
            border-radius: 12px !important;
            color: #f8fafc !important;
            font-family: 'Inter', sans-serif !important;
            font-size: 0.95rem !important;
            padding: 16px 20px !important;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5) !important;
            pointer-events: none;
            z-index: 1000;
            max-width: 300px;
            line-height: 1.5;
        }

        .vis-tooltip b {
            color: #38bdf8;
            font-weight: 800;
            text-transform: uppercase;
            font-size: 0.75rem;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <header>
        <h1>SecondSelf</h1>
        <p>Interactive Knowledge Graph</p>
    </header>

    <div id="mynetwork"></div>

    <!-- Import Graph Data -->
    <!-- Ensures graphData variable is loaded before initializing network -->
    <script src="graph_data.js"></script>

    <script type="text/javascript">
        // Ensure data was loaded successfully
        if (typeof graphData === 'undefined') {
            alert("Error: graph_data.js not found or corrupted. Please run build_graph.py first.");
        } else {
            // Container
            var container = document.getElementById('mynetwork');

            // Data
            var data = {
                nodes: new vis.DataSet(graphData.nodes),
                edges: new vis.DataSet(graphData.edges)
            };

            // Options & Styling
            var options = {
                nodes: {
                    shape: 'dot',
                    size: 24,
                    font: {
                        size: 14,
                        color: '#f8fafc',
                        face: 'Inter',
                        strokeWidth: 3,
                        strokeColor: '#0f172a'
                    },
                    borderWidth: 2,
                    shadow: true
                },
                edges: {
                    width: 1.5,
                    color: {
                        color: 'rgba(148, 163, 184, 0.4)',
                        highlight: '#38bdf8',
                        hover: '#818cf8'
                    },
                    smooth: {
                        type: 'continuous'
                    }
                },
                groups: {
                    Projects: {
                        color: { background: '#ef4444', border: '#b91c1c', highlight: { background: '#f87171', border: '#ef4444' } }
                    },
                    Areas: {
                        color: { background: '#3b82f6', border: '#1d4ed8', highlight: { background: '#60a5fa', border: '#3b82f6' } }
                    },
                    Resources: {
                        color: { background: '#10b981', border: '#047857', highlight: { background: '#34d399', border: '#10b981' } }
                    },
                    Archives: {
                        color: { background: '#64748b', border: '#334155', highlight: { background: '#94a3b8', border: '#64748b' } }
                    }
                },
                physics: {
                    forceAtlas2Based: {
                        gravitationalConstant: -100,
                        centralGravity: 0.01,
                        springLength: 200,
                        springConstant: 0.08
                    },
                    maxVelocity: 50,
                    solver: 'forceAtlas2Based',
                    timestep: 0.35,
                    stabilization: { iterations: 150 }
                },
                interaction: {
                    hover: true,
                    tooltipDelay: 150,
                    zoomView: true,
                    dragView: true
                }
            };

            // Initialize Network
            var network = new vis.Network(container, data, options);
        }
    </script>
</body>
</html>
